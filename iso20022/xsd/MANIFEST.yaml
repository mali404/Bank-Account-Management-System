# version, SHA-256 of the official file, the iso20022.org catalogue URL it is
# downloaded from, the business area, and what the testbed uses it for.
#
# The .xsd files are not committed. Redistribution terms are unclear, so
# `make iso-setup` fetches them and keeps a file only when its SHA-256 matches
# this manifest. Verify offline with `make xsd-verify` or re-download and
# compare with `make xsd-fetch` (needs network). See iso20022/README.md for the
# source statement. Do not edit the .xsd files. [VERIFY] notes mark versions
# the spec flags as unconfirmed.

