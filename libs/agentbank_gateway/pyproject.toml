[project]
name = "agentbank-gateway"
version = "0.1.0"
description = "Agent gateway: defense plugin host and taint-tracking interfaces for the AgentBank-Sec testbed."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Munawar Ali" }]
dependencies = [
    "agentbank-common",
    "langgraph>=0.6",
    "openai-agents>=0.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbank_gateway"]

[tool.uv.sources]
agentbank-common = { workspace = true }
