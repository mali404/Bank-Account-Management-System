[project]
name = "agentbank-common"
version = "0.1.0"
description = "Shared utilities for the AgentBank-Sec testbed (money, ids, time, settings, logging, results schema)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Munawar Ali" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbank_common"]
