[project]
name = "agentbank-ledger"
version = "0.1.0"
description = "Double-entry ledger helpers and TigerBeetle settlement wrapper for the AgentBank-Sec testbed."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Munawar Ali" }]
dependencies = [
    "agentbank-common",
    "agentbank-iso",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbank_ledger"]

[tool.uv.sources]
agentbank-iso = { workspace = true }
agentbank-common = { workspace = true }
