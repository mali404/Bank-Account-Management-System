name: agentic-bank

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_bank
      POSTGRES_USER: agentic_admin
      POSTGRES_PASSWORD: agentic_admin_pw
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_admin -d agentic_bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ollama-init:
    # One-shot: pulls the model once and exits.
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "OLLAMA_HOST=ollama:11434 ollama pull llama3.1:8b-instruct-q4_K_M"
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentic_app:agentic_app_pw@postgres:5432/agentic_bank
      DATABASE_SYNC_URL: postgresql+psycopg://agentic_app:agentic_app_pw@postgres:5432/agentic_bank
      DATABASE_ADMIN_URL: postgresql+psycopg://agentic_admin:agentic_admin_pw@postgres:5432/agentic_bank
      OLLAMA_BASE_URL: http://ollama:11434
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_BASE: http://localhost:8000
      # Compose mounts secrets at /run/secrets/<name> (no file extension);
      # override the .env defaults so paths match the mounts exactly.
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      AUDIT_HMAC_KEY_PATH: /run/secrets/audit_hmac
      DB_COLUMN_DEK_PATH: /run/secrets/db_column_dek
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      jaeger:
        condition: service_started
    secrets:
      - jwt_private
      - jwt_public
      - audit_hmac
      - db_column_dek
    ports: ["8000:8000"]

secrets:
  jwt_private:
    file: ../../secrets/jwt_private.pem
  jwt_public:
    file: ../../secrets/jwt_public.pem
  audit_hmac:
    file: ../../secrets/audit_hmac.key
  db_column_dek:
    file: ../../secrets/db_column_dek.key

volumes:
  pg_data:
  ollama_data:
  grafana_data:
