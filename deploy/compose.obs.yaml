# Overlay: observability (OTel Collector, Jaeger, OpenSearch, Prometheus).
# Use with the base file:
#   docker compose -f deploy/compose.yaml -f deploy/compose.obs.yaml up
# Image tags are pinned. Host ports bind to 127.0.0.1. This overlay is not
# started by `make up`. Unit tests use the in-memory exporter instead.
name: agentbank

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - edge
      - agent-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
