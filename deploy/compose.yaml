# AgentBank-Sec Testbed — core infrastructure (milestone M0).
#
# M0 ships ONLY the core infra: postgres, nats, keycloak, step-ca. The
# application services (bank-core, psp-core, switch, agents, MCP servers, …)
# and the observability stack are added in later milestones and live in the
# overlay files compose.llm.yaml / compose.obs.yaml / compose.mojaloop.yaml.
#
# Networks (SPEC §15): edge is the only externally reachable network; bank-net,
# switch-net and agent-net are `internal: true` (no route off-host); egress is
# reserved for opt-in LLM-API access from the agent gateway and is attached to
# no M0 service. A container on only internal networks cannot publish host
# ports, so in M0 ONLY Keycloak (on `edge`) is host-exposed. Postgres, NATS and
# step-ca are reached via `docker compose exec` (see scripts/check_health.sh and
# the test-compose target). This keeps the SC-7 boundary-protection model honest.
#
# Image tags are pinned to specific versions (never `latest`). Pinning image
# *digests* is a CM-2 reproducibility task scheduled for a later milestone.
# Every published host port binds to 127.0.0.1 only.

name: agentbank

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - bank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  nats:
    # Alpine variant so the image includes a busybox `wget` for the healthcheck.
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    networks:
      - switch-net
    healthcheck:
      # NATS monitoring /healthz on 8222 (JetStream enabled via nats.conf).
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      # Health endpoints are served on the management port 9000.
      KC_HTTP_MANAGEMENT_PORT: "9000"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    networks:
      - edge
      - bank-net
    ports:
      - "127.0.0.1:8080:8080"   # HTTP (realm OIDC endpoints)
      - "127.0.0.1:9000:9000"   # management (health/metrics)
    healthcheck:
      # The image ships bash but not curl; use bash's /dev/tcp to GET
      # /health/ready on the management port and look for the UP status.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q 'UP'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s   # Keycloak boots slowly; give it room.
    restart: unless-stopped

  step-ca:
    image: smallstep/step-ca:0.28.4
    environment:
      DOCKER_STEPCA_INIT_NAME: ${STEPCA_INIT_NAME:?set in .env}
      DOCKER_STEPCA_INIT_DNS_NAMES: ${STEPCA_INIT_DNS_NAMES:?set in .env}
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEPCA_INIT_PROVISIONER_NAME:?set in .env}
      # The CA key-encryption password is passed non-interactively from .env
      # (generated by scripts/bootstrap.sh). We deliberately do NOT bind-mount
      # anything over /home/step/secrets: the entrypoint's `step ca init` writes
      # the generated keys there and then moves the password into it, so that
      # path must be writable and owned by the container's `step` user. Mounting
      # a host file there breaks init (read-only) and depends on the host uid.
      DOCKER_STEPCA_INIT_PASSWORD: ${STEPCA_INIT_PASSWORD:?set STEPCA_INIT_PASSWORD in .env}
    volumes:
      - stepcadata:/home/step
    networks:
      - switch-net
      - bank-net
    healthcheck:
      test:
        - CMD
        - step
        - ca
        - health
        - --ca-url
        - https://localhost:9000
        - --root
        - /home/step/certs/root_ca.crt
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  edge: {}
  bank-net:
    internal: true
  switch-net:
    internal: true
  agent-net:
    internal: true
  # Opt-in LLM-API egress (SPEC §15, §17); attached to no M0 service.
  egress: {}

volumes:
  pgdata: {}
  natsdata: {}
  stepcadata: {}
