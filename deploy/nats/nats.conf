# NATS JetStream configuration for the SimNow switch transport (SPEC §13, §15).
# JetStream gives durable streams for switch <-> bank ISO 20022 traffic.

# Client connections.
port: 4222

# HTTP monitoring endpoint (healthz, jsz) on 8222.
http: 8222

# Enable JetStream with an on-disk store in the mounted volume.
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 268435456   # 256 MiB
  max_file_store: 1073741824    # 1 GiB
}
